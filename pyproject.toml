[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vlm-trojan-cue"
version = "0.0.1"
description = "Cue-integration-based backdoor detection for vision-language models"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-learn>=1.3",
]

[tool.setuptools.packages.find]
where = ["src"]
